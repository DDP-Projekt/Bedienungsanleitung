baseURL = 'http://doku.ddp.im'
disablePathToLower = true
disableKinds = ['taxonomy', 'term']
disableHugoGeneratorInject = true
defaultContentLanguage = 'de'
enableRobotsTXT = true

[languages]
	[languages.de]
		contentDir = 'content/DE'
		disabled = false
		locale = 'de-DE'
		direction = 'ltr'
		label = 'Deutsch'
		title = 'DDP Bedienungsanleitung'
		weight = 1
		[languages.de.params]
			subtitle = 'Die Dokumentation der Deutschen Programmiersprache.'
	[languages.en]
		contentDir = 'content/EN'
		disabled = false
		locale = 'en-US'
		direction = 'ltr'
		label = 'English'
		title = 'DDP Bedienungsanleitung - Documentation'
		weight = 2
		[languages.en.params]
			subtitle = 'The documentation for DDP.'

[markup.goldmark.renderer]
	unsafe= true
